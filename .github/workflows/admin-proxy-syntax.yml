name: JavaScript syntax audit

on:
  push:
    paths:
      - "**/*.js"
      - "admin.html"
      - "admin.css"
      - ".github/workflows/admin-proxy-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' | sort)

      - name: Reject Node-incompatible Response.json usage
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.js' 'Response[[:space:]]*\.[[:space:]]*json[[:space:]]*\(' api; then
            echo "::error::Use new Response(JSON.stringify(...), ...) or a local JSON helper in Node functions."
            exit 1
          fi

      - name: Verify Node runtime target
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('./package.json').engines?.node||''; if(!v.startsWith('>=22')){throw new Error('package.json must target Node >=22 for Vercel Functions. Got: '+v)}"
