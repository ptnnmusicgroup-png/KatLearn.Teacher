name: admin proxy syntax

on:
  push:
    paths:
      - "admin.html"
      - "admin.css"
      - "admin.js"
      - "api/_admin-proxy.js"
      - "api/admin-hub.js"
      - ".github/workflows/admin-proxy-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Admin client syntax
        run: node --check admin.js
      - name: Check Admin proxy syntax
        run: |
          node --check api/_admin-proxy.js
          node --check api/admin-hub.js
