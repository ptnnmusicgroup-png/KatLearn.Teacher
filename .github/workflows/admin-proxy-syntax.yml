name: Teacher standalone checks

on:
  push:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.html"
      - "package.json"
      - ".env.example"
      - ".github/workflows/admin-proxy-syntax.yml"
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run standalone server smoke test
        run: node scripts/smoke-standalone.mjs
      - name: Check every JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './node_modules/*' -not -path './dist/*' | sort)
      - name: Check inline browser scripts
        run: node scripts/check-inline-scripts.mjs
      - name: Reject retired Netlify runtime references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInEi --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist 'netlify|\.netlify' .; then
            echo "::error::A retired Netlify runtime reference remains."
            exit 1
          fi
      - name: Verify standalone runtime files
        run: |
          test -s server.js
          test -s scripts/smoke-standalone.mjs
          test ! -e netlify.toml
          test ! -e netlify
          test ! -e scripts/build-netlify.mjs
