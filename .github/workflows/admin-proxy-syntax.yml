name: admin proxy syntax

on:
  push:
    paths:
      - "api/_admin-proxy.js"
      - "api/admin-state.js"
      - "api/admin-verify-teacher.js"
      - "api/national-catalog-sync.js"
      - "api/admin-hub.js"
      - "admin.html"
      - ".github/workflows/admin-proxy-syntax.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check API syntax
        run: |
          node --check api/_admin-proxy.js
          node --check api/admin-state.js
          node --check api/admin-verify-teacher.js
          node --check api/national-catalog-sync.js
      - name: Check Admin page module syntax
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('admin.html','utf8');
          const match=html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if(!match)throw new Error('Admin module script not found');
          const source=match[1]
            .replace(/^import.*$/gm,'')
            .replace(/^export default /gm,'');
          new Function(source);
          console.log('Admin module syntax OK');
          NODE
