name: relocate legacy-address schools

on:
  push:
    paths:
      - "catalog/trigger-legacy-school-relocate.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Relocate and add schools
        run: |
          python <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          TREE=Path("data/national-catalog/full-school-tree.json")
          SOURCE="https://raw.githubusercontent.com/Aph3li0s/Database-Project/master/Phan_2/data/tables_csv/Schools.csv"
          SPLITS="https://raw.githubusercontent.com/dvhcvn/20250701/main/mapping/splits.json"
          WARDS="https://raw.githubusercontent.com/ptnnmusicgroup-png/KatLearn.Teacher/main/data/national-catalog/official-ward-list.json"

          def norm(v):
              import unicodedata
              s=str(v or "").replace("&amp;","&")
              s="".join(c for c in unicodedata.normalize("NFD",s) if unicodedata.category(c)!="Mn")
              s=s.replace("đ","d").replace("Đ","D").lower()
              return re.sub(r"[^a-z0-9]+"," ",s).strip()

          def parse_csv(s):
              out=[];row=[];cell="";q=False;i=0
              while i<len(s):
                  ch=s[i]
                  if q:
                      if ch=='"' and i+1<len(s) and s[i+1]=='"':cell+='"';i+=1
                      elif ch=='"':q=False
                      else:cell+=ch
                  else:
                      if ch=='"':q=True
                      elif ch==',':row.append(cell);cell=""
                      elif ch=='\n':row.append(cell);out.append(row);row=[];cell=""
                      elif ch!='\r':cell+=ch
                  i+=1
              if cell or row:row.append(cell);out.append(row)
              return out

          tree=json.loads(TREE.read_text(encoding="utf-8"))
          split_data=requests.get(SPLITS,timeout=60).json()["data"]
          wards=requests.get(WARDS,timeout=60).json()["provinces"]

          oldprov_to_current={}
          oldward_to_new={}
          for p in split_data:
              ds=p.get("splits") or []
              if ds: oldprov_to_current[p["level1_id"]]=ds[0]["name"]
              for o in p.get("level3s",[]):
                  dest=o.get("splits") or []
                  if len(dest)==1: oldward_to_new[(p["level1_id"],norm(o["name"]))]=dest[0]["new_id"]

          code_to_current={(p["code"],w["id"]):(p["name"],w["name"]) for p in wards for w in p.get("wards",[])}
          tree_wards={(p["name"],norm(w["name"])):w for p in tree for w in p.get("wards",[])}

          # Index all current records by province + normalized bare name.
          index={}
          for p in tree:
              for wi,w in enumerate(p.get("wards",[])):
                  for si,s in enumerate(w.get("schools",[])):
                      bare=re.sub(r"^\([^)]*\)\s*","",str(s.get("name",""))).strip()
                      index.setdefault((p["name"],norm(bare)),[]).append((w,si,s))

          rows=parse_csv(requests.get(SOURCE,timeout=60).text)[1:]
          moved=added=updated=ambiguous=skipped=0
          by_level={"TH":0,"THCS":0,"THPT":0}

          for row in rows:
              if len(row)<3:continue
              code,name,address=[str(x).strip() for x in row[:3]]
              n=norm(name)
              if re.search(r"mầm non|mẫu giáo|mn\b",n):continue
              level="THPT" if re.search(r"thpt|trung hoc pho thong",n) else "THCS" if re.search(r"thcs|trung hoc co so",n) else "TH" if re.search(r"tieu hoc|(^|\s)th\b",n) else None
              if not level:continue
              oldp=code[:2]; cp=oldprov_to_current.get(oldp)
              if not cp:continue
              a=norm(address)
              candidates=[(on,newid) for (pp,on),newid in oldward_to_new.items() if pp==oldp and len(on)>=4 and re.search(r"\b"+re.escape(on)+r"\b",a)]
              if len(candidates)!=1:
                  ambiguous+=1;continue
              new_id=candidates[0][1]
              target_info=code_to_current.get((cp,new_id))
              if not target_info:
                  skipped+=1;continue
              pname,wname=target_info
              target=tree_wards.get((pname,norm(wname)))
              if not target:
                  skipped+=1;continue

              hits=index.get((pname,n),[])
              # exact name already in target => normalize code to source code where safe.
              same_target=[x for x in hits if x[0] is target]
              if same_target:
                  item=same_target[0][2]
                  oldbare=re.sub(r"^\([^)]*\)\s*","",str(item.get("name",""))).strip()
                  item["name"]=f"({code}) {oldbare}"
                  updated+=1
                  continue

              # One unique same-named record in another ward: source mapping gives evidence to relocate it.
              if len(hits)==1:
                  srcw,si,item=hits[0]
                  srcw.setdefault("schools",[]).pop(si)
                  item["name"]=f"({code}) {re.sub(r'^\([^)]*\)\s*','',str(item.get('name',''))).strip()}"
                  target.setdefault("schools",[]).append(item)
                  moved+=1
                  by_level[level]+=1
                  # rebuild affected index entries cheaply
                  continue

              # No existing same-named record: add.
              if len(hits)==0:
                  sid="legacy_school_"+hashlib.sha1(f"{pname}|{new_id}|{code}|{name}".encode("utf-8")).hexdigest()[:20]
                  item={"id":sid,"name":f"({code}) {name}"}
                  target.setdefault("schools",[]).append(item)
                  added+=1
                  by_level[level]+=1
              else:
                  ambiguous+=1

          TREE.write_text(json.dumps(tree,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
              "moved":moved,
              "added":added,
              "updated":updated,
              "byLevel":by_level,
              "ambiguous":ambiguous,
              "skipped":skipped,
              "schoolsAfter":sum(len(w.get("schools",[])) for p in tree for w in p.get("wards",[])),
              "emptyWardsAfter":sum(1 for p in tree for w in p.get("wards",[]) if not w.get("schools")),
              "formatErrors":sum(1 for p in tree for w in p.get("wards",[]) for s in w.get("schools",[]) if not re.match(r"^\([^)]*\)\s+.+$",str(s.get("name",""))))
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit relocation
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): relocate legacy schools to current wards"
          git push
