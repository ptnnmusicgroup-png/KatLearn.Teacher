name: legacy-address school enrichment

on:
  push:
    paths:
      - "catalog/trigger-legacy-school-enrich.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Map legacy school addresses through 2025 administrative splits
        run: |
          python <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          TREE=Path("data/national-catalog/full-school-tree.json")
          SOURCE="https://raw.githubusercontent.com/Aph3li0s/Database-Project/master/Phan_2/data/tables_csv/Schools.csv"
          SPLITS="https://raw.githubusercontent.com/dvhcvn/20250701/main/mapping/splits.json"

          def norm(v):
              import unicodedata
              s=str(v or "").replace("&amp;","&")
              s="".join(c for c in unicodedata.normalize("NFD",s) if unicodedata.category(c)!="Mn")
              s=s.replace("đ","d").replace("Đ","D").lower()
              return re.sub(r"[^a-z0-9]+"," ",s).strip()

          def parse_csv(s):
              out=[];row=[];cell="";quoted=False;i=0
              while i<len(s):
                  ch=s[i]
                  if quoted:
                      if ch=='"' and i+1<len(s) and s[i+1]=='"': cell+='"';i+=1
                      elif ch=='"': quoted=False
                      else: cell+=ch
                  else:
                      if ch=='"': quoted=True
                      elif ch==',': row.append(cell);cell=""
                      elif ch=='\n': row.append(cell);out.append(row);row=[];cell=""
                      elif ch!='\r': cell+=ch
                  i+=1
              if cell or row: row.append(cell);out.append(row)
              return out

          tree=json.loads(TREE.read_text(encoding="utf-8"))
          split_data=requests.get(SPLITS,timeout=60,headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"}).json()["data"]
          source_prov_to_current={}
          oldward={}
          for p in split_data:
              # level1 split tells which new province contains this old province.
              pto=(p.get("splits") or [])
              if pto:
                  source_prov_to_current[p["level1_id"]]=pto[0]["name"]
              for x in p.get("level3s",[]):
                  dests=x.get("splits") or []
                  if len(dests)==1:
                      oldward[(p["level1_id"],norm(x["name"]))]=dests[0]["new_id"]

          current_ward={}
          for p in tree:
              # current ward code is the stable key used by the user's uploaded file.
              for w in p.get("wards",[]):
                  m=re.search(r"^",str(w.get("name","")))
                  # We resolve ward codes from the official list later by name; build name index here.
                  current_ward[(p["name"],norm(w["name"]))]=w

          # Download official current ward list and build code -> current ward name.
          WARDS="https://raw.githubusercontent.com/ptnnmusicgroup-png/KatLearn.Teacher/main/data/national-catalog/official-ward-list.json"
          wd=requests.get(WARDS,timeout=60,headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"}).json()
          code_to_current={(p["code"],w["id"]):(p["name"],w["name"]) for p in wd["provinces"] for w in p.get("wards",[])}

          existing=set()
          used_codes=set()
          for p in tree:
              for w in p.get("wards",[]):
                  for s in w.get("schools",[]):
                      clean=re.sub(r"^\([^)]*\)\s*","",str(s.get("name",""))).strip()
                      existing.add((p["name"],norm(clean)))
                      m=re.match(r"^\(([^)]*)\)",str(s.get("name","")))
                      if m: used_codes.add(m.group(1))

          rows=parse_csv(requests.get(SOURCE,timeout=60,headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"}).text)[1:]
          added=0
          by_level={"TH":0,"THCS":0,"THPT":0}
          ambiguous=0
          no_ward=0

          for row in rows:
              if len(row)<3: continue
              code,name,address=[str(x).strip() for x in row[:3]]
              n=norm(name)
              if re.search(r"mầm non|mẫu giáo|mn\b",n): continue
              level = "THPT" if re.search(r"thpt|trung hoc pho thong",n) else "THCS" if re.search(r"thcs|trung hoc co so",n) else "TH" if re.search(r"tieu hoc|(^|\s)th\b",n) else None
              if not level: continue

              oldp=code[:2]
              current_p=source_prov_to_current.get(oldp)
              if not current_p: continue

              a=norm(address)
              candidates=[]
              for (pcode,oldname),new_id in oldward.items():
                  if pcode!=oldp: continue
                  old_bare=oldname
                  if len(old_bare)<4: continue
                  if re.search(r"\b"+re.escape(old_bare)+r"\b",a):
                      candidates.append((old_bare,new_id))
              # Prefer exact old ward token. Ignore ambiguous source rows with multiple old ward hits.
              if len(candidates)!=1:
                  ambiguous+=1
                  continue

              new_id=candidates[0][1]
              target_info=code_to_current.get((current_p,new_id))
              if not target_info:
                  no_ward+=1
                  continue
              pname,wname=target_info
              target=current_ward.get((pname,norm(wname)))
              if not target:
                  no_ward+=1
                  continue

              key=(pname,n)
              if key in existing:
                  continue

              # Preserve source school code verbatim; this directory uses it as its school identifier.
              sid="legacy_school_"+hashlib.sha1(f"{pname}|{new_id}|{code}|{name}".encode("utf-8")).hexdigest()[:20]
              item={"id":sid,"name":f"({code}) {name}"}
              target.setdefault("schools",[]).append(item)
              existing.add(key)
              used_codes.add(code)
              added+=1
              by_level[level]+=1

          TREE.write_text(json.dumps(tree,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          stats={
              "sourceRows":len(rows),
              "uniqueLegacyWardMappings":sum(1 for p in split_data for x in p.get("level3s",[]) if len(x.get("splits") or [])==1),
              "added":added,
              "byLevel":by_level,
              "ambiguous":ambiguous,
              "noWard":no_ward,
              "schoolsAfter":sum(len(w.get("schools",[])) for p in tree for w in p.get("wards",[])),
              "emptyWardsAfter":sum(1 for p in tree for w in p.get("wards",[]) if not w.get("schools")),
              "formatErrors":sum(1 for p in tree for w in p.get("wards",[]) for s in w.get("schools",[]) if not re.match(r"^\([^)]*\)\s+.+$",str(s.get("name",""))))
          }
          print(json.dumps(stats,ensure_ascii=False,indent=2))
          PY

      - name: Commit enrichment
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): map legacy school addresses to current wards"
          git push
