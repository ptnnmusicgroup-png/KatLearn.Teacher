name: Netlify build smoke check

on:
  push:
    branches: [main, codex/ui-motion-refresh, chore/netlify-only-remove-legacy-hosting, feat/teacher-classroom-games-dark-theme]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' | sort)
          for file in scripts/*.mjs netlify/adapter.mjs netlify/functions/*.mjs api/*.js; do
            node --check "$file"
          done
          node scripts/check-inline-scripts.mjs
      - name: Ensure legacy signup URL only redirects to the Teacher catalog form
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'teacher-signup.html' signup.html
          grep -q 'window.location.replace' signup.html
          if grep -Eq 'getDocs|initializeApp|firebase-firestore|collection\(' signup.html; then
            echo "::error::Legacy signup page must not run the retired Firestore catalog loader."
            exit 1
          fi
          grep -q 'LMS_CATALOG' teacher-signup.html
          echo "Verified signup.html redirects to the static LMS-backed Teacher registration form."
      - name: Verify the full LMS theme is shared across Teacher user-facing pages
        shell: bash
        run: |
          set -euo pipefail
          test -s katlearn-defaultdarkmode.css
          test -s teacher-katlearn-auth-theme.css
          for page in index.html login.html teacher-signup.html teacher-pending.html sso-bridge.html; do
            grep -q 'katlearn-defaultdarkmode.css' "$page"
            grep -q 'teacher-katlearn-auth-theme.css\|teacher-katlearn-theme.css' "$page"
          done
          grep -q 'body class="sso-bridge"' sso-bridge.html
          grep -q 'body class="teacher-pending"' teacher-pending.html
          echo "Verified LMS Default Dark Mode and Teacher adapters are linked on every user-facing Teacher page."
      - name: Build Netlify static output
        env:
          KATLEARN_LMS_SITE_URL: https://lms-katlearn.netlify.app
          KATLEARN_TEACHER_SITE_URL: https://quanly-giaovien-katlearn.netlify.app
          KATLEARN_ALLOWED_ORIGINS: https://lms-katlearn.netlify.app,https://quanly-giaovien-katlearn.netlify.app
        run: node scripts/build-netlify.mjs
      - name: Ensure production site URL overrides stale Teacher URL config
        env:
          CONTEXT: production
          URL: https://quanly-giaovien-katlearn.netlify.app
          KATLEARN_LMS_SITE_URL: https://lms-katlearn.netlify.app
        shell: bash
        run: |
          set -euo pipefail
          legacy_teacher_host="$(printf '%s%s%s' 'https://teacher-katlearn' '1' '.netlify.app')"
          KATLEARN_TEACHER_SITE_URL="$legacy_teacher_host" node scripts/build-netlify.mjs
          grep -q '"teacherUrl":"https://quanly-giaovien-katlearn.netlify.app"' dist/deployment-config.js
      - name: Verify static publish excludes server files and settings
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/deployment-config.js
          test -s dist/teacher-signup.html
          test -s dist/katlearn-astra.css
          test -s dist/katlearn-defaultdarkmode.css
          test -s dist/teacher-katlearn-theme.css
          test -s dist/teacher-katlearn-auth-theme.css
          test -s dist/teacher-classroom-games.js
          test -s dist/teacher-learning-tools.js
          test -s dist/teacher-learning-tools.css
          grep -q 'data-page="games"' dist/index.html
          grep -q 'teacher-classroom-games.js' dist/index.html
          grep -q 'teacher-learning-tools.js' dist/index.html
          grep -q 'teacher-learning-tools.css' dist/index.html
          grep -q 'data-tool-card="flashcards"' dist/index.html
          for page in login.html teacher-signup.html teacher-pending.html sso-bridge.html; do
            grep -q 'katlearn-defaultdarkmode.css' "dist/$page"
            grep -q 'teacher-katlearn-auth-theme.css' "dist/$page"
          done
          if grep -Eq 'modern-ui.css|katlearn-blue-theme.css|teacher-system-ui-v3.css|katlearn-astra.css|teacher-lms-professional.css' dist/index.html; then
            echo "::error::Obsolete light/blue/Astra theme layer is still loaded by the Teacher dashboard."
            exit 1
          fi
          grep -q 'quanly-giaovien-katlearn.netlify.app' dist/deployment-config.js
          grep -q 'teacher-katlearn-auth-theme.css' dist/teacher-signup.html
          grep -q 'page-lms-directory' dist/admin.html
          test ! -e dist/api
          test ! -e dist/netlify
          test ! -e dist/scripts
          test ! -e dist/.env.example
          test ! -e dist/netlify.toml
          test ! -e dist/NETLIFY_MIGRATION.md
      - name: Reject retired hosting references in source
        shell: bash
        run: |
          set -euo pipefail
          # Compose forbidden signatures from fragments so this guard does not
          # leave complete retired-provider names embedded in the repository.
          retired_hosting_pattern="$(printf '%s%s|%s%s|%s[.]%s|%s[.]%s|%s%s' \
            'ver' 'cel' 'cloud' 'flare' 'pages' 'dev' 'workers' 'dev' 'wran' 'gler')"
          legacy_teacher_host="$(printf '%s%s%s' 'https://teacher-katlearn' '1' '.netlify.app')"
          scan_args=(--exclude-dir=.git --exclude-dir=dist --exclude-dir=node_modules --exclude-dir=.netlify)
          if grep -RInEi "${scan_args[@]}" -E "$retired_hosting_pattern" .; then
            echo "::error::Retired-hosting reference found in source."
            exit 1
          fi
          if grep -RInF "${scan_args[@]}" "$legacy_teacher_host" .; then
            echo "::error::Stale Teacher hostname found in source."
            exit 1
          fi
          if grep -RInF "$legacy_teacher_host" dist; then
            echo "::error::Stale Teacher hostname leaked into the published output."
            exit 1
          fi
