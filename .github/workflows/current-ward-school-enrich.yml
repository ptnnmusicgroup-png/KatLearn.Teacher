name: current-ward primary-secondary enrichment

on:
  push:
    paths:
      - "api/catalog-harvest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Enrich TH and THCS from school directory
        run: |
          python <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          TREE=Path("data/national-catalog/full-school-tree.json")
          WARDS=Path("data/national-catalog/official-ward-list.json")
          SOURCE="https://raw.githubusercontent.com/Aph3li0s/Database-Project/master/Phan_2/data/tables_csv/Schools.csv"

          def norm(v):
              import unicodedata
              s=str(v or "").replace("&amp;","&")
              s="".join(c for c in unicodedata.normalize("NFD",s) if unicodedata.category(c)!="Mn")
              s=s.replace("đ","d").replace("Đ","D").lower()
              return re.sub(r"[^a-z0-9]+"," ",s).strip()

          def parse_csv(s):
              out=[]; row=[]; cell=""; quoted=False
              i=0
              while i<len(s):
                  ch=s[i]
                  if quoted:
                      if ch=='"' and i+1<len(s) and s[i+1]=='"':
                          cell+='"'; i+=1
                      elif ch=='"': quoted=False
                      else: cell+=ch
                  else:
                      if ch=='"': quoted=True
                      elif ch==',': row.append(cell); cell=""
                      elif ch=='\n':
                          row.append(cell); out.append(row); row=[]; cell=""
                      elif ch!='\r': cell+=ch
                  i+=1
              if cell or row: row.append(cell); out.append(row)
              return out

          tree=json.loads(TREE.read_text(encoding="utf-8"))
          wards=json.loads(WARDS.read_text(encoding="utf-8"))
          ward_by_prov={p["code"]:[{"id":w["id"],"name":w["name"],"bare":norm(re.sub(r"^(Xã|Phường|Đặc khu)\s+","",w["name"],flags=re.I))} for w in p.get("wards",[])] for p in wards["provinces"]}
          prov_name={p["code"]:p["name"] for p in wards["provinces"]}
          tree_ward={(p["name"],norm(w["name"])):w for p in tree for w in p.get("wards",[])}

          existing=set()
          for p in tree:
              for w in p.get("wards",[]):
                  for s in w.get("schools",[]):
                      clean=re.sub(r"^\([^)]*\)\s*","",str(s.get("name",""))).strip()
                      existing.add((p["name"],norm(clean)))

          rr=requests.get(SOURCE,timeout=60,headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"})
          rr.raise_for_status()
          rows=parse_csv(rr.text)[1:]
          added=0
          skipped=0
          by_level={"TH":0,"THCS":0}
          for row in rows:
              if len(row)<3: continue
              code,name,address=[str(x).strip() for x in row[:3]]
              n=norm(name)
              level="THCS" if re.search(r"thcs|trung hoc co so",n) else "TH" if re.search(r"ti[eế]u hoc|(^|\s)th\b",n) else None
              if not level: continue

              pcode=code[:2]
              pname=prov_name.get(pcode)
              if not pname: continue
              a=norm(address)
              hits=[w for w in ward_by_prov.get(pcode,[]) if w["bare"] and w["bare"] in a]
              if len(hits)!=1:
                  skipped+=1
                  continue

              wname=hits[0]["name"]
              target=tree_ward.get((pname,norm(wname)))
              if not target:
                  skipped+=1
                  continue
              key=(pname,n)
              if key in existing:
                  continue

              sid="directory_school_"+hashlib.sha1(f"{pname}|{hits[0]['id']}|{code}|{name}".encode("utf-8")).hexdigest()[:20]
              item={"id":sid,"name":f"({code}) {name}"}
              target.setdefault("schools",[]).append(item)
              existing.add(key)
              added+=1
              by_level[level]+=1

          TREE.write_text(json.dumps(tree,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          stats={
              "sourceRows":len(rows),
              "added":added,
              "byLevel":by_level,
              "skippedAmbiguousWard":skipped,
              "schoolsAfter":sum(len(w.get("schools",[])) for p in tree for w in p.get("wards",[])),
              "emptyWardsAfter":sum(1 for p in tree for w in p.get("wards",[]) if not w.get("schools")),
              "formatErrors":sum(1 for p in tree for w in p.get("wards",[]) for s in w.get("schools",[]) if not re.match(r"^\([^)]*\)\s+.+$",str(s.get("name",""))))
          }
          print(json.dumps(stats,ensure_ascii=False,indent=2))
          PY

      - name: Commit enriched catalog
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): enrich TH and THCS by current ward"
          git push
