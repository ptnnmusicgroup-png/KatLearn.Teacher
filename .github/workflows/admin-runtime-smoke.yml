name: Admin runtime smoke
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check LMS Admin Hub without auth
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 'https://lms-katlearn.netlify.app/api/admin-hub?section=overview' || true)"
            echo "Attempt $i: HTTP $code"
            cat "$body" || true
            if [ "$code" = "401" ] && grep -q 'missing_admin_token' "$body"; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Check Teacher Admin proxy or diagnose Netlify Edge Access
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 'https://quanly-giaovien-katlearn.netlify.app/api/admin-hub?section=overview' || true)"
          echo "Teacher proxy HTTP $code"
          if [ "$code" = "401" ] && grep -q 'missing_admin_token' "$body"; then
            echo "Teacher proxy responds with the expected unauthenticated JSON response."
            exit 0
          fi
          if grep -Eqi 'app\.netlify\.com/edge-access|edge-access' "$body"; then
            echo "::warning::Teacher proxy is gated by Netlify Edge Access. The Teacher Admin UI now uses the LMS Admin Hub directly as its primary endpoint and retains this proxy only as a fallback."
            exit 0
          fi
          cat "$body" || true
          echo "::error::Teacher proxy returned an unexpected response."
          exit 1
