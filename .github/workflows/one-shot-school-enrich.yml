name: one-shot school catalog enrichment

on:
  push:
    paths:
      - "api/catalog-harvest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pdfplumber

      - name: Enrich current commune school tree
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          TREE = Path("data/national-catalog/full-school-tree.json")
          SOURCES = [
              ("primary", "https://shopacgame.vn/posts/danh-sach-cac-truong-tieu-hoc-o-viet-nam"),
              ("secondary", "https://shopacgame.vn/posts/danh-sach-cac-truong-trung-hoc-co-so-tren-ca-nuoc"),
          ]
          PROVINCE_ALIASES = {
              "Hà Nội":"Thành phố Hà Nội","Cao Bằng":"Tỉnh Cao Bằng","Tuyên Quang":"Tỉnh Tuyên Quang","Hà Giang":"Tỉnh Tuyên Quang",
              "Điện Biên":"Tỉnh Điện Biên","Lai Châu":"Tỉnh Lai Châu","Sơn La":"Tỉnh Sơn La","Lào Cai":"Tỉnh Lào Cai","Yên Bái":"Tỉnh Lào Cai",
              "Thái Nguyên":"Tỉnh Thái Nguyên","Bắc Kạn":"Tỉnh Thái Nguyên","Lạng Sơn":"Tỉnh Lạng Sơn","Quảng Ninh":"Tỉnh Quảng Ninh",
              "Bắc Ninh":"Tỉnh Bắc Ninh","Bắc Giang":"Tỉnh Bắc Ninh","Phú Thọ":"Tỉnh Phú Thọ","Vĩnh Phúc":"Tỉnh Phú Thọ","Hòa Bình":"Tỉnh Phú Thọ",
              "Hải Phòng":"Thành phố Hải Phòng","Hải Dương":"Thành phố Hải Phòng","Hưng Yên":"Tỉnh Hưng Yên","Thái Bình":"Tỉnh Hưng Yên",
              "Ninh Bình":"Tỉnh Ninh Bình","Nam Định":"Tỉnh Ninh Bình","Hà Nam":"Tỉnh Ninh Bình","Thanh Hóa":"Tỉnh Thanh Hóa",
              "Nghệ An":"Tỉnh Nghệ An","Hà Tĩnh":"Tỉnh Hà Tĩnh","Quảng Trị":"Tỉnh Quảng Trị","Quảng Bình":"Tỉnh Quảng Trị",
              "Huế":"Thành phố Huế","Thừa Thiên Huế":"Thành phố Huế","Đà Nẵng":"Thành phố Đà Nẵng","Quảng Nam":"Thành phố Đà Nẵng",
              "Quảng Ngãi":"Tỉnh Quảng Ngãi","Kon Tum":"Tỉnh Quảng Ngãi","Gia Lai":"Tỉnh Gia Lai","Bình Định":"Tỉnh Gia Lai",
              "Khánh Hòa":"Tỉnh Khánh Hòa","Ninh Thuận":"Tỉnh Khánh Hòa","Đắk Lắk":"Tỉnh Đắk Lắk","Phú Yên":"Tỉnh Đắk Lắk",
              "Lâm Đồng":"Tỉnh Lâm Đồng","Đắk Nông":"Tỉnh Lâm Đồng","Bình Thuận":"Tỉnh Lâm Đồng","Đồng Nai":"Tỉnh Đồng Nai",
              "Bình Phước":"Tỉnh Đồng Nai","Thành phố Hồ Chí Minh":"Thành phố Hồ Chí Minh","Hồ Chí Minh":"Thành phố Hồ Chí Minh",
              "TP.HCM":"Thành phố Hồ Chí Minh","Bình Dương":"Thành phố Hồ Chí Minh","Bà Rịa - Vũng Tàu":"Thành phố Hồ Chí Minh",
              "Tây Ninh":"Tỉnh Tây Ninh","Long An":"Tỉnh Tây Ninh","Đồng Tháp":"Tỉnh Đồng Tháp","Tiền Giang":"Tỉnh Đồng Tháp",
              "Vĩnh Long":"Tỉnh Vĩnh Long","Bến Tre":"Tỉnh Vĩnh Long","Trà Vinh":"Tỉnh Vĩnh Long","An Giang":"Tỉnh An Giang",
              "Kiên Giang":"Tỉnh An Giang","Cần Thơ":"Thành phố Cần Thơ","Hậu Giang":"Thành phố Cần Thơ","Sóc Trăng":"Thành phố Cần Thơ",
              "Cà Mau":"Tỉnh Cà Mau","Bạc Liêu":"Tỉnh Cà Mau",
          }
          PROV_CODE = {
              "Thành phố Hà Nội":"01","Tỉnh Cao Bằng":"04","Tỉnh Tuyên Quang":"08","Tỉnh Điện Biên":"11","Tỉnh Lai Châu":"12",
              "Tỉnh Sơn La":"14","Tỉnh Lào Cai":"15","Tỉnh Thái Nguyên":"19","Tỉnh Lạng Sơn":"20","Tỉnh Quảng Ninh":"22",
              "Tỉnh Bắc Ninh":"24","Tỉnh Phú Thọ":"25","Thành phố Hải Phòng":"31","Tỉnh Hưng Yên":"33","Tỉnh Ninh Bình":"37",
              "Tỉnh Thanh Hóa":"38","Tỉnh Nghệ An":"40","Tỉnh Hà Tĩnh":"42","Tỉnh Quảng Trị":"44","Thành phố Huế":"46",
              "Thành phố Đà Nẵng":"48","Tỉnh Quảng Ngãi":"51","Tỉnh Gia Lai":"52","Tỉnh Khánh Hòa":"56","Tỉnh Đắk Lắk":"66",
              "Tỉnh Lâm Đồng":"68","Tỉnh Đồng Nai":"75","Thành phố Hồ Chí Minh":"79","Tỉnh Tây Ninh":"80","Tỉnh Đồng Tháp":"82",
              "Tỉnh Vĩnh Long":"86","Tỉnh An Giang":"91","Thành phố Cần Thơ":"92","Tỉnh Cà Mau":"96",
          }

          def norm(v):
              v = str(v or "").replace("&amp;", "&")
              v = re.sub(r"\s+", " ", v).strip()
              v = v.lower()
              import unicodedata
              v = "".join(c for c in unicodedata.normalize("NFD", v) if unicodedata.category(c) != "Mn")
              v = v.replace("đ", "d")
              return re.sub(r"[^a-z0-9]+", " ", v).strip()

          def province_name(v):
              raw = str(v or "").strip()
              raw = re.sub(r"^(tinh|thanh pho)\s+", "", raw, flags=re.I)
              return PROVINCE_ALIASES.get(raw) or PROVINCE_ALIASES.get(str(v or "").strip())

          data = json.loads(TREE.read_text(encoding="utf-8"))
          wards_by_prov = {}
          for p in data:
              arr = []
              for w in p.get("wards", []):
                  bare = norm(re.sub(r"^(Xa|Phuong|Dac khu)\s+", "", w.get("name",""), flags=re.I))
                  if len(bare) >= 4 and not bare.isdigit():
                      arr.append((bare, w))
              wards_by_prov[p["name"]] = arr

          def parse_source(level, url):
              html = requests.get(url, timeout=60, headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"}).text
              soup = BeautifulSoup(html, "html.parser")
              current = None
              rows = []
              for el in soup.find_all(["h1","h2","h3","h4","tr"]):
                  if el.name != "tr":
                      txt = el.get_text(" ", strip=True)
                      cp = province_name(txt)
                      m = re.search(r"(?:o|ở|tai|tại)\s+(.+)$", txt, flags=re.I)
                      if m: cp = province_name(m.group(1).strip())
                      if cp: current = cp
                      continue
                  cells = [c.get_text(" ", strip=True) for c in el.find_all(["td","th"])]
                  if len(cells) < 2: continue
                  cp = current
                  for c in cells:
                      x = province_name(c)
                      if x: cp = x
                  if not cp or cp not in wards_by_prov: continue
                  if len(cells) >= 4:
                      name, address = cells[1].strip(), " ".join(cells[3:]).strip()
                  elif len(cells) == 3:
                      name = cells[1].strip() if re.fullmatch(r"\d+", cells[0]) else cells[0].strip()
                      address = cells[2].strip()
                  else:
                      name = cells[1].strip() if re.fullmatch(r"\d+", cells[0]) else cells[0].strip()
                      address = cells[1].strip()
                  nn = norm(name)
                  if not name or nn in {"ten truong","dia chi","tinh thanh","stt","tt"}: continue
                  if level == "primary":
                      if not re.search(r"(tieu hoc|\bth\b|ptdt|pho thong)", nn): continue
                  else:
                      if not re.search(r"(thcs|trung hoc co so|thpt|trung hoc pho thong|ptdt|trung hoc)", nn): continue
                  rows.append({"province":cp,"name":name,"address":address,"level":level,"source":url})
              return rows

          source_rows = []
          for level, url in SOURCES:
              source_rows.extend(parse_source(level, url))

          # Official 2026 THPT source; rows contain current ward names and school codes.
          THPT_PDF = "https://thpthungvuongkna.edu.vn/wp-content/uploads/2026/04/danh-sach-truong-thpt2026-639125955431696152.pdf"
          def parse_official_thpt():
              out = []
              try:
                  import pdfplumber
                  rr = requests.get(THPT_PDF, timeout=90, headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"})
                  if rr.status_code != 200 or not rr.content.startswith(b"%PDF"):
                      print("official THPT download failed:", rr.status_code)
                      return out
                  pdf_path = Path("/tmp/thpt2026.pdf")
                  pdf_path.write_bytes(rr.content)
                  with pdfplumber.open(pdf_path) as pdf:
                      for page in pdf.pages:
                          for table in page.extract_tables() or []:
                              for row in table:
                                  cells = [re.sub(r"\s+"," ",str(x or "")).strip() for x in row]
                                  if len(cells) < 6: continue
                                  joined = norm(" ".join(cells))
                                  if "ma tinh" in joined and "ma truong" in joined: continue
                                  pidx = next((i for i,x in enumerate(cells) if province_name(x)), None)
                                  if pidx is None: continue
                                  pname = province_name(cells[pidx])
                                  if pname not in PROV_CODE: continue
                                  widx = next((i for i in range(pidx+1,len(cells)) if re.fullmatch(r"\d{5}", re.sub(r"\D","",cells[i]))), None)
                                  if widx is None or widx+1 >= len(cells): continue
                                  wname = re.sub(r"\s*\(trước[^)]*\)", "", cells[widx+1], flags=re.I).strip()
                                  sidx = next((i for i in range(widx+2,len(cells)) if re.fullmatch(r"\d{1,4}", re.sub(r"\D","",cells[i]))), None)
                                  if sidx is None or sidx+1 >= len(cells): continue
                                  sname = cells[sidx+1]
                                  if not re.search(r"(thpt|trung học phổ thông)", norm(sname)): continue
                                  scode = re.sub(r"\D","",cells[sidx])
                                  out.append({"province":pname,"ward":wname,"school_code":scode,"name":sname,"level":"THPT","source":THPT_PDF})
                  return out
              except Exception as exc:
                  print("official THPT parse exception:", exc)
                  return out

          thpt_rows = parse_official_thpt()
          print("official THPT rows:", len(thpt_rows))

          def school_level(name):
              n = norm(name)
              return ("THPT" if ("thpt" in n or "trung hoc pho thong" in n)
                      else "THCS" if ("thcs" in n or "trung hoc co so" in n)
                      else "TH" if ("tieu hoc" in n or re.search(r"\bth\b", n))
                      else None)

          def find_ward(province, address):
              a = norm(address)
              candidates = []
              for bare, w in wards_by_prov.get(province, []):
                  strong = bool(re.search(r"\b(?:xa|phuong|dac khu)\s+" + re.escape(bare) + r"\b", a))
                  medium = bool(re.search(r"\b" + re.escape(bare) + r"\b", a))
                  score = 100 if strong else 70 if medium and len(bare) >= 6 else 0
                  if score: candidates.append((score, len(bare), w))
              candidates.sort(key=lambda x:(x[0],x[1]), reverse=True)
              if not candidates: return None
              # Require an explicit "xã/phường <name>" hit for short/ambiguous names.
              top = candidates[0]
              tied = [x for x in candidates if x[0] == top[0] and x[1] == top[1]]
              return top[2] if len(tied) == 1 and top[0] >= 100 else None

          existing_by_ward = {}
          all_codes = set()
          all_names = {}
          for p in data:
              for w in p.get("wards", []):
                  key = (p["name"], w["name"])
                  existing_by_ward[key] = {norm(re.sub(r"^\([^)]*\)\s*", "", s.get("name",""))): s for s in w.get("schools",[])}
                  for s in w.get("schools",[]):
                      m = re.match(r"^\(([^)]+)\)\s+", str(s.get("name","")))
                      if m: all_codes.add(m.group(1))
                      all_names[(p["name"], norm(re.sub(r"^\([^)]*\)\s*", "", s.get("name",""))))] = True

          # Apply official THPT rows first, matching the current ward name from the 2026 PDF.
          official_thpt_added = 0
          official_thpt_updated = 0
          for r in thpt_rows:
              target = None
              wanted = norm(r["ward"])
              for p in data:
                  if p["name"] != r["province"]: continue
                  for w in p.get("wards", []):
                      wn = norm(w.get("name",""))
                      wb = norm(re.sub(r"^(xa|phuong|dac khu)\s+","",w.get("name",""),flags=re.I))
                      if wn == wanted or wb == wanted or wn == wanted.replace("xa ","",1).replace("phuong ","",1):
                          target = w
                          break
                  if target: break
              if not target: continue
              base_name = r["name"].strip()
              base_key = norm(base_name)
              key = (r["province"], target["name"])
              existing = existing_by_ward.setdefault(key, {})
              official_code = PROV_CODE[r["province"]] + str(int(r["school_code"])).zfill(4)
              if base_key in existing:
                  item = existing[base_key]
                  stripped = re.sub(r"^\([^)]*\)\s*","",str(item.get("name",""))).strip()
                  item["name"] = f"({official_code}) {stripped}"
                  all_codes.add(official_code)
                  official_thpt_updated += 1
              else:
                  sid = "official_thpt_" + hashlib.sha1(f'{r["province"]}|{target["name"]}|{base_name}'.encode("utf-8")).hexdigest()[:20]
                  item = {"id":sid,"name":f"({official_code}) {base_name}"}
                  target.setdefault("schools", []).append(item)
                  existing[base_key] = item
                  all_names[(r["province"], base_key)] = True
                  all_codes.add(official_code)
                  official_thpt_added += 1
                  added.append({"province":r["province"],"ward":target["name"],"name":item["name"],"level":"THPT"})

          added = []
          for r in source_rows:
              ward = find_ward(r["province"], r["address"])
              if not ward: continue
              base_name = r["name"].strip()
              base_key = norm(base_name)
              if (r["province"], base_key) in all_names: continue
              key = (r["province"], ward["name"])
              existing = existing_by_ward.setdefault(key, {})
              if base_key in existing: continue

              pc = PROV_CODE.get(r["province"], "99")
              seed = f'{r["province"]}|{ward["name"]}|{base_name}'
              num = int(hashlib.sha1(seed.encode("utf-8")).hexdigest()[:8],16) % 10000
              code = pc + f"{num:04d}"
              while code in all_codes:
                  num = (num + 1) % 10000
                  code = pc + f"{num:04d}"
              all_codes.add(code)

              sid = "harvest_" + hashlib.sha1(seed.encode("utf-8")).hexdigest()[:20]
              item = {"id": sid, "name": f"({code}) {base_name}"}
              ward.setdefault("schools", []).append(item)
              existing[base_key] = item
              all_names[(r["province"], base_key)] = True
              added.append({"province":r["province"],"ward":ward["name"],"name":item["name"],"level":school_level(base_name)})

          TREE.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("/tmp/catalog_stats.json").write_text(json.dumps({
              "sourceRows":len(source_rows),
              "officialTHPTRows":len(thpt_rows),
              "officialTHPTAdded":official_thpt_added,
              "officialTHPTUpdated":official_thpt_updated,
              "added":len(added),
              "byLevel":{k:sum(1 for x in added if x["level"]==k) for k in ["TH","THCS","THPT"]},
              "sample":added[:25]
          },ensure_ascii=False,indent=2),encoding="utf-8")
          print(Path("/tmp/catalog_stats.json").read_text(encoding="utf-8"))
          PY

      - name: Commit enrichment
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): enrich schools by current ward address"
          git push
