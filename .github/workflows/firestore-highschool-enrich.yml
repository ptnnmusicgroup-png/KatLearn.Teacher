name: firestore high-school catalog enrichment

on:
  push:
    paths:
      - "api/catalog-harvest.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Enrich THPT from public Firestore dataset
        run: |
          python <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          TREE = Path("data/national-catalog/full-school-tree.json")
          WARDS = Path("data/national-catalog/official-ward-list.json")
          PROJECT = "vietnam-map-prm393"

          def norm(v):
              import unicodedata
              s = str(v or "").replace("&amp;","&")
              s = "".join(c for c in unicodedata.normalize("NFD", s) if unicodedata.category(c) != "Mn")
              s = s.replace("đ","d").replace("Đ","D").lower()
              return re.sub(r"[^a-z0-9]+"," ",s).strip()

          def fv(v):
              if not isinstance(v, dict): return None
              for k in ("stringValue","integerValue","doubleValue","booleanValue"):
                  if k in v: return v[k]
              return None

          tree = json.loads(TREE.read_text(encoding="utf-8"))
          wards = json.loads(WARDS.read_text(encoding="utf-8"))

          ward_target = {}
          for p in wards.get("provinces", []):
              for w in p.get("wards", []):
                  ward_target[(p["code"], w["id"])] = (p["name"], w["name"])

          tree_ward = {(p["name"], norm(w["name"])): w for p in tree for w in p.get("wards", [])}

          base = f"https://firestore.googleapis.com/v1/projects/{PROJECT}/databases/(default)/documents/high_schools"
          token = None
          source_rows = []
          while True:
              params = {"pageSize": 1000}
              if token: params["pageToken"] = token
              r = requests.get(base, params=params, timeout=30, headers={"User-Agent":"KatLearn-Catalog-Enricher/1.0"})
              print("Firestore status:", r.status_code)
              r.raise_for_status()
              body = r.json()
              for doc in body.get("documents", []):
                  f = doc.get("fields", {})
                  pcode = str(fv(f.get("ma_tinh_tp")) or "").zfill(2)
                  wcode = str(fv(f.get("ma_xa_phuong")) or "").zfill(5)
                  scode = str(fv(f.get("ma_truong")) or "").zfill(3)
                  sname = str(fv(f.get("ten_truong")) or "").strip()
                  if pcode and wcode and scode and sname and re.search(r"(THPT|trung học phổ thông)", sname, re.I):
                      source_rows.append({"pcode":pcode,"wcode":wcode,"scode":scode,"name":sname})
              token = body.get("nextPageToken")
              if not token: break

          existing_by_ward = {}
          for p in tree:
              for w in p.get("wards", []):
                  existing_by_ward[(p["name"],w["name"])] = {
                      norm(re.sub(r"^\([^)]*\)\s*","",str(s.get("name",""))).strip()): s
                      for s in w.get("schools",[])
                  }

          added = updated = skipped = 0
          for r in source_rows:
              target_info = ward_target.get((r["pcode"],r["wcode"]))
              if not target_info:
                  skipped += 1
                  continue
              pname,wname = target_info
              target = tree_ward.get((pname,norm(wname)))
              if not target:
                  skipped += 1
                  continue
              key=(pname,target["name"])
              existing=existing_by_ward.setdefault(key,{})
              nk=norm(r["name"])
              if nk in existing:
                  item=existing[nk]
                  clean=re.sub(r"^\([^)]*\)\s*","",str(item.get("name",""))).strip()
                  item["name"]=f"({r['scode']}) {clean}"
                  updated += 1
              else:
                  sid="firestore_thpt_"+hashlib.sha1(f"{pname}|{r['wcode']}|{r['name']}".encode("utf-8")).hexdigest()[:20]
                  item={"id":sid,"name":f"({r['scode']}) {r['name']}"}
                  target.setdefault("schools",[]).append(item)
                  existing[nk]=item
                  added += 1

          TREE.write_text(json.dumps(tree,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          stats={
              "sourceRows":len(source_rows),
              "added":added,
              "updated":updated,
              "skipped":skipped,
              "schoolsAfter":sum(len(w.get("schools",[])) for p in tree for w in p.get("wards",[])),
              "emptyWardsAfter":sum(1 for p in tree for w in p.get("wards",[]) if not w.get("schools")),
              "formatErrors":sum(
                  1 for p in tree for w in p.get("wards",[]) for s in w.get("schools",[])
                  if not re.match(r"^\([^)]*\)\s+.+$",str(s.get("name","")))
              )
          }
          print(json.dumps(stats,ensure_ascii=False,indent=2))
          PY

      - name: Commit enriched catalog
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): enrich THPT from public Firestore dataset"
          git push
