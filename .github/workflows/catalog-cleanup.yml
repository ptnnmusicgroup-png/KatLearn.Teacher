name: catalog cleanup and validation

on:
  push:
    paths:
      - "catalog/trigger-catalog-cleanup.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cleanup invalid derived THPT records and validate
        run: |
          python <<'PY'
          import json, re
          from pathlib import Path
          TREE=Path("data/national-catalog/full-school-tree.json")
          data=json.loads(TREE.read_text(encoding="utf-8"))

          removed={"historical":0,"area":0,"gdtX":0,"otherDerivedInvalid":0}
          kept=0
          for p in data:
              for w in p.get("wards",[]):
                  out=[]
                  for s in w.get("schools",[]):
                      sid=str(s.get("id",""))
                      name=str(s.get("name",""))
                      if sid.startswith("firestore_thpt_"):
                          bare=re.sub(r"^\([^)]*\)\s*","",name).strip().lower()
                          if re.search(r"\btrước\b|\bcũ\b",bare):
                              removed["historical"]+=1; continue
                          if "khu vực" in bare:
                              removed["area"]+=1; continue
                          if "gdtx" in bare or "hệ gdtx" in bare:
                              removed["gdtX"]+=1; continue
                      out.append(s)
                  w["schools"]=out

          stats={
              "provinces":len(data),
              "wards":sum(len(p.get("wards",[])) for p in data),
              "schools":sum(len(w.get("schools",[])) for p in data for w in p.get("wards",[])),
              "emptyWards":sum(1 for p in data for w in p.get("wards",[]) if not w.get("schools")),
              "formatErrors":sum(1 for p in data for w in p.get("wards",[]) for s in w.get("schools",[]) if not re.match(r"^\([^)]*\)\s+.+$",str(s.get("name","")))),
              "duplicateIds":0,
              "duplicateCodesWithinProvince":0,
              "byLevel":{"TH":0,"THCS":0,"THPT":0,"other":0},
              "removed":removed
          }
          ids=set()
          for p in data:
              codes={}
              for w in p.get("wards",[]):
                  for s in w.get("schools",[]):
                      sid=str(s.get("id",""))
                      if sid in ids: stats["duplicateIds"]+=1
                      ids.add(sid)
                      m=re.match(r"^\(([^)]*)\)",str(s.get("name","")))
                      if m: codes[m.group(1)]=codes.get(m.group(1),0)+1
                      low=str(s.get("name","")).lower()
                      if re.search(r"\bthpt\b|trung học phổ thông",low): stats["byLevel"]["THPT"]+=1
                      elif re.search(r"\bthcs\b|trung học cơ sở",low): stats["byLevel"]["THCS"]+=1
                      elif re.search(r"tiểu học|\bth\b",low): stats["byLevel"]["TH"]+=1
                      else: stats["byLevel"]["other"]+=1
              stats["duplicateCodesWithinProvince"] += sum(1 for v in codes.values() if v>1)

          TREE.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(stats,ensure_ascii=False,indent=2))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "KatLearn Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/national-catalog/full-school-tree.json
          git diff --cached --quiet && exit 0
          git commit -m "data(catalog): remove historical and non-school THPT records"
          git push
